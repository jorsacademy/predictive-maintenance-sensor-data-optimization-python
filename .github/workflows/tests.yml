name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline self-test
        run: python predictive_maintenance_cmapss_optimization.py --self-test

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run real NASA C-MAPSS FD001 integration
        run: |
          python predictive_maintenance_cmapss_optimization.py \
            --data-dir data/raw \
            --seed 42 \
            --capacity-per-period 8
